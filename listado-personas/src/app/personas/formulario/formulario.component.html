<div class="box">
  <form
    class="item"
    #f="ngForm"
    (ngSubmit)="f.form.valid && onGuardarPersona()"
  >
    <input
      type="text"
      name="nombre"
      id="nombre"
      placeholder="Nombre"
      [(ngModel)]="nombreInput"
      required
    />
    <input
      type="text"
      name="apellido"
      id="apellido"
      placeholder="Apellido"
      [(ngModel)]="apellidoInput"
      required
    />
    <button type="submit" style="cursor: pointer">+</button>
    @if(index != null){
    <button
      type="submit"
      style="cursor: pointer"
      class="buttonRed"
      (click)="eliminarPersona()"
    >
      -
    </button>
    }
    <!--<button
      type="submit"
      style="cursor: pointer"
      class="buttonRed"
      *ngIf="index != null"
      (click)="eliminarPersona()"
    >
      -
    </button>-->
    <!-- Older versions of Angular -->
  </form>
</div>
